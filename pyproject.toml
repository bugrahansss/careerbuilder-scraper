[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "careerbuilder-scraper"
version = "0.1.0"
description = "Scrape CareerBuilder job listings with Python: search by title and location, get company, location with coordinates, pay range, work mode and employment type, and full job descriptions."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Buğrahan Saka" }]
keywords = ["careerbuilder", "jobs", "job listings", "job scraper", "salary", "recruiting", "labor market", "web scraping", "scraper", "scrapedo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://github.com/bugrahansss/careerbuilder-scraper"
Source = "https://github.com/bugrahansss/careerbuilder-scraper"
Issues = "https://github.com/bugrahansss/careerbuilder-scraper/issues"

[project.scripts]
careerbuilder-scraper = "careerbuilder_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
